name: build

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download AutoHotkey v2 and Ahk2Exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force tools | Out-Null
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'sniper-cancel-build' }
          $ahk = Invoke-RestMethod -Headers $h https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest
          $ahkAsset = $ahk.assets | Where-Object { $_.name -like 'AutoHotkey_2*.zip' } | Select-Object -First 1
          Write-Host "AutoHotkey: $($ahkAsset.name)"
          Invoke-WebRequest $ahkAsset.browser_download_url -OutFile tools/ahk.zip
          Expand-Archive tools/ahk.zip -DestinationPath tools/ahk
          $a2e = Invoke-RestMethod -Headers $h https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest
          $a2eAsset = $a2e.assets | Where-Object { $_.name -like '*.zip' } | Select-Object -First 1
          Write-Host "Ahk2Exe: $($a2eAsset.name)"
          Invoke-WebRequest $a2eAsset.browser_download_url -OutFile tools/ahk2exe.zip
          Expand-Archive tools/ahk2exe.zip -DestinationPath tools/ahk2exe
          Get-ChildItem -Recurse tools/ahk, tools/ahk2exe -Filter *.exe | ForEach-Object { $_.FullName }

      - name: Set version number
        shell: pwsh
        run: |
          $v = "1.0.${{ github.run_number }}"
          $f = 'SniperCancel.ahk'
          $t = [IO.File]::ReadAllText($f)
          $t = $t -replace 'global AppVersion := "[^"]*"', "global AppVersion := `"$v`""
          $t = $t -replace ';@Ahk2Exe-SetVersion .*', ";@Ahk2Exe-SetVersion $v"
          [IO.File]::WriteAllText($f, $t, (New-Object Text.UTF8Encoding $true))
          Select-String -Path $f -Pattern 'AppVersion :=|SetVersion'

      - name: Check script for errors
        shell: pwsh
        run: |
          $out = & tools/ahk/AutoHotkey64.exe /ErrorStdOut /validate SniperCancel.ahk 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "script has errors" }

      - name: Timing accuracy (test branches only)
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          $out = & tools/ahk/AutoHotkey64.exe /ErrorStdOut tests/timing_test.ahk 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "precise wait is off by more than 4 ms on average, or random timing is not spread" }

      - name: Compile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $p = Start-Process tools/ahk2exe/Ahk2Exe.exe -Wait -PassThru -ArgumentList `
            '/in', 'SniperCancel.ahk', '/out', 'dist/SniperCancel.exe', '/base', 'tools/ahk/AutoHotkey64.exe', '/silent', 'verbose'
          if (-not (Test-Path dist/SniperCancel.exe)) { throw "compile failed (exit $($p.ExitCode))" }
          Get-Item dist/SniperCancel.exe

      - uses: actions/upload-artifact@v5
        with:
          name: SniperCancel
          path: dist/SniperCancel.exe

      - name: Measure idle CPU and memory (test branches only)
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          $p = Start-Process dist/SniperCancel.exe -PassThru
          Start-Sleep 5
          $p.Refresh(); $cpu0 = $p.TotalProcessorTime.TotalMilliseconds
          Start-Sleep 30
          $p.Refresh(); $cpu1 = $p.TotalProcessorTime.TotalMilliseconds
          $ws = [math]::Round($p.WorkingSet64 / 1MB, 1)
          $priv = [math]::Round($p.PrivateMemorySize64 / 1MB, 1)
          Write-Host "Idle CPU over 30 s: $([math]::Round($cpu1 - $cpu0)) ms ($([math]::Round(($cpu1 - $cpu0) / 300, 3)) %)"
          Write-Host "Working set: $ws MB, private: $priv MB"
          $second = Start-Process dist/SniperCancel.exe -PassThru
          Start-Sleep 3
          $count = (Get-Process SniperCancel -ErrorAction SilentlyContinue).Count
          Write-Host "Instances after second launch: $count"
          Stop-Process -Name SniperCancel -Force
          if ($count -ne 1) { throw "second copy kept running" }

      - name: Screenshot and memory check (test branches only)
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD/shots/$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
          }
          function WebViewMB { $w = Get-Process msedgewebview2 -ErrorAction SilentlyContinue; if ($w) { [math]::Round(($w | Measure-Object WorkingSet64 -Sum).Sum / 1MB, 1) } else { 0 } }
          New-Item -ItemType Directory -Force shots | Out-Null
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          Write-Host "WebView2 runtime: $((Get-ItemProperty $key -ErrorAction SilentlyContinue).pv)"
          $before = WebViewMB
          $p = Start-Process dist/SniperCancel.exe -PassThru
          Start-Sleep 6
          Shot off
          Write-Host "Settings window open: webview $(WebViewMB) MB (before launch $before MB)"
          Set-Content -Encoding utf8 press.ahk 'SendLevel 1', 'Send "{F8}"'
          & tools/ahk/AutoHotkey64.exe press.ahk
          Start-Sleep 2
          Shot on
          Set-Content -Encoding utf8 close.ahk 'WinClose "ahk_pid " A_Args[1]'
          & tools/ahk/AutoHotkey64.exe close.ahk $p.Id
          Start-Sleep 4
          $p.Refresh()
          Write-Host "After closing the window: app $([math]::Round($p.WorkingSet64 / 1MB, 1)) MB, webview $(WebViewMB) MB, app alive: $(-not $p.HasExited)"
          Stop-Process -Id $p.Id -Force
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          $src = "${{ github.ref_name }}"
          git checkout --orphan ci-screenshots
          git rm -rfq --cached .
          git add -f shots/*.png
          git commit -qm "screenshots from $src"
          git push -f origin ci-screenshots

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          gh release create $tag dist/SniperCancel.exe --title "كاتم السنايبر $tag" --notes "حمّل SniperCancel.exe وشغّله." --latest
