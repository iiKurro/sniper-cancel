<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>كاتم السنايبر</title>
<style>
:root{
  --bg:#07080a; --panel:rgba(22,24,29,.72); --panel2:#111318; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --txt:#f4f4f5; --muted:#9a9aa3; --dim:#5d5f68;
  --acc:#ff7a1a; --acc2:#ffb020; --accGlow:rgba(255,122,26,.45);
  --ok:#ff7a1a;
}
*{box-sizing:border-box;margin:0;padding:0}

.app{position:relative;background:var(--bg);color:var(--txt);padding:18px 22px 16px;min-height:100vh;overflow:hidden}
/* dot grid + top glow */
.app:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:18px 18px;mask-image:linear-gradient(#000,transparent 70%);pointer-events:none}
.app:after{content:"";position:absolute;top:-180px;left:50%;width:520px;height:360px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,122,26,.18),transparent);pointer-events:none;transition:opacity .4s;opacity:.35}
.on .app:after{opacity:1}
.app>*{position:relative;z-index:1}

/* header */
.hd{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,#1d1f25,#0e0f12);border:1px solid var(--line2);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.logo svg{width:28px;height:28px}
.on .logo svg .ring{animation:spin 6s linear infinite;transform-origin:50% 50%}
.hd .t{flex:1}
.hd h1{font-size:21px;font-weight:800;letter-spacing:-.2px}
.hd p{font-size:12px;color:var(--muted);margin-top:1px}
.pill{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;padding:6px 12px 6px 14px;border-radius:99px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:50%;background:#52525b;position:relative}
.on .pill{color:var(--acc);border-color:rgba(255,122,26,.35);background:rgba(255,122,26,.08)}
.on .pill i{background:var(--acc);box-shadow:0 0 10px var(--acc)}
.on .pill i:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--acc);animation:ping 1.6s ease-out infinite}

/* cards */
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);margin:13px 4px 8px}
.h svg{width:14px;height:14px;stroke:var(--acc)}
.h .sp{flex:1}
.h small{font-weight:500;color:var(--dim)}

/* hero power */
.hero{display:flex;align-items:center;gap:16px;padding:13px 16px;overflow:hidden}
.hero .border{position:absolute;inset:-1px;border-radius:16px;padding:1px;background:conic-gradient(from var(--a,0deg),transparent 0 70%,var(--acc) 85%,var(--acc2) 92%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .4s}
.on .hero .border{opacity:1}
.pw{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;cursor:pointer;background:radial-gradient(circle at 50% 35%,#24262d,#121318);border:1px solid var(--line2);box-shadow:inset 0 2px 0 rgba(255,255,255,.06),0 6px 16px #0008;transition:.3s}
.pw svg{width:26px;height:26px;stroke:#71717a;transition:.3s}
.on .pw{background:radial-gradient(circle at 50% 35%,#ff9a3d,#ff6a00);border-color:#ffb46b;box-shadow:0 0 0 6px rgba(255,122,26,.12),0 0 34px var(--accGlow),inset 0 2px 0 rgba(255,255,255,.35)}
.on .pw svg{stroke:#1a0b00}
.hero .tx{flex:1}
.hero b{font-size:17px;font-weight:800;display:block}
.hero span{font-size:12px;color:var(--muted)}
.mini{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:20px;padding:0 6px;border-radius:5px;font:800 11px 'Cascadia Mono','Consolas',monospace;background:#1c1e24;border:1px solid #33353d;border-bottom-width:2px;color:var(--txt);margin:0 3px;vertical-align:1px}
.stat{text-align:center;padding:0 4px}
.stat .n{font:800 22px 'Cascadia Mono','Consolas',monospace;color:var(--txt);direction:ltr}
.on .stat .n{color:var(--acc);text-shadow:0 0 18px var(--accGlow)}
.stat .l{font-size:10.5px;color:var(--dim)}

/* sequence timeline */
.seq{padding:12px 14px 10px}
.flow{display:flex;align-items:center}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;width:62px;flex:none}
.node .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#16181d;border:1px solid var(--line2)}
.node .ic svg{width:19px;height:19px;stroke:var(--txt)}
.node:first-child .ic{background:linear-gradient(145deg,rgba(255,122,26,.25),rgba(255,122,26,.05));border-color:rgba(255,122,26,.5)}
.node:first-child .ic svg{stroke:var(--acc)}
.node span{font-size:11px;color:var(--muted);font-weight:600}
.edge{flex:1;position:relative;height:40px;display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.edge:before{content:"";position:absolute;inset:50% 0 auto;height:2px;background:repeating-linear-gradient(90deg,#3a3c44 0 5px,transparent 5px 9px)}
.on .edge:before{background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:200% 100%;animation:flow 1.4s linear infinite}
.edge em{position:relative;font:800 11px 'Cascadia Mono','Consolas',monospace;font-style:normal;background:#0d0e12;border:1px solid var(--line2);color:var(--txt);padding:2px 7px;border-radius:99px;direction:ltr}
.edge em u{text-decoration:none;color:var(--dim);font-weight:600;margin-left:2px}

/* keys grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.key{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;cursor:pointer;transition:.2s}
.key:hover{border-color:rgba(255,122,26,.35)}
.key .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.key .ic svg{width:17px;height:17px;stroke:var(--muted)}
.key .tx{flex:1;min-width:0}
.key .tx b{display:block;font-size:13px;font-weight:700}
.key .tx span{font-size:10.5px;color:var(--dim)}
.cap{min-width:54px;height:38px;padding:0 10px;border-radius:9px;display:grid;place-items:center;font:800 14px 'Cascadia Mono','Consolas','Segoe UI',monospace;color:var(--txt);
  background:linear-gradient(180deg,#2a2c33,#1a1b20);border:1px solid #3a3c45;box-shadow:0 3px 0 #0b0b0e,0 4px 10px #0007,inset 0 1px 0 rgba(255,255,255,.1)}
.cap.ar{font-family:'Segoe UI';font-size:12px;font-weight:700}
.cap.wait{color:var(--acc);border-color:var(--acc);box-shadow:0 3px 0 #3a1800,0 0 0 4px rgba(255,122,26,.15),0 0 22px var(--accGlow);animation:pulse 1.1s ease-in-out infinite;font-family:'Segoe UI';font-size:11.5px}
.key.wait{border-color:rgba(255,122,26,.5)}

/* sliders */
.sl{padding:6px 16px}
.srow{display:grid;grid-template-columns:118px 1fr 70px;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow label{font-size:12.5px;font-weight:600}
.track{position:relative;height:6px;border-radius:99px;background:#22242b;direction:ltr}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#ff6a00,#ffb020);box-shadow:0 0 12px rgba(255,122,26,.35)}
.track .th{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(255,122,26,.25),0 2px 6px #000a}
.val{display:flex;align-items:center;justify-content:center;gap:3px;height:28px;border-radius:8px;background:#0d0e12;border:1px solid var(--line2);font:800 13px 'Cascadia Mono','Consolas',monospace;direction:ltr}
.val u{text-decoration:none;font:600 10px 'Segoe UI';color:var(--dim)}

/* auto detect */
.opt{display:flex;align-items:center;gap:12px;padding:12px 16px}
.opt .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.opt .ic svg{width:17px;height:17px;stroke:var(--muted)}
.opt .tx{flex:1}
.opt b{font-size:13px;display:block}
.opt span{font-size:11px;color:var(--dim)}
.sw{width:44px;height:24px;border-radius:99px;background:#2a2c33;position:relative;border:1px solid var(--line2);transition:.25s;flex:none}
.sw:after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:18px;height:18px;border-radius:50%;background:#d4d4d8;transition:.25s;box-shadow:0 1px 3px #0008}
.sw.lit{background:linear-gradient(90deg,#ff6a00,#ffb020);border-color:transparent;box-shadow:0 0 14px var(--accGlow)}
.sw.lit:after{inset-inline-start:22px;background:#fff}

.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:10.5px;color:var(--dim)}
.foot .r{display:flex;gap:6px;align-items:center}
.foot svg{width:12px;height:12px;stroke:var(--dim)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.8);opacity:0}}
@keyframes flow{from{background-position:200% 0}to{background-position:0 0}}
@keyframes pulse{50%{box-shadow:0 3px 0 #3a1800,0 0 0 7px rgba(255,122,26,.08),0 0 30px var(--accGlow)}}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.on .hero .border{animation:rot 4s linear infinite}
@keyframes rot{to{--a:360deg}}

html,body{background:#07080a;margin:0;height:100%}
body{font-family:'Segoe UI Variable Text','Segoe UI',Tahoma,sans-serif;overflow-y:auto;overflow-x:hidden;user-select:none;-webkit-user-select:none}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#2a2c33;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.pw:hover{transform:scale(1.04)} .pw:active{transform:scale(.97)}
.cap:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0b0e}
.sw{cursor:pointer}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;direction:ltr;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,#ff6a00,#ffb020) 0/var(--p,0%) 100% no-repeat,#22242b}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,122,26,.25),0 2px 6px #000a;transition:box-shadow .2s}
input[type=range]:hover::-webkit-slider-thumb{box-shadow:0 0 0 6px rgba(255,122,26,.3),0 2px 6px #000a}
.val input{width:38px;background:transparent;border:0;outline:0;color:var(--txt);font:800 13px 'Cascadia Mono',Consolas,monospace;text-align:center;direction:ltr}
.val:focus-within{border-color:var(--acc)}
.n{transition:color .3s}
.lang{display:flex;padding:3px;border-radius:99px;background:rgba(255,255,255,.03);border:1px solid var(--line2);direction:ltr}
.lang button{all:unset;cursor:pointer;font:700 11px 'Segoe UI',sans-serif;color:var(--dim);padding:4px 10px;border-radius:99px;transition:.2s}
.lang button:hover{color:var(--txt)}
.lang button.act{background:#22242b;color:var(--txt);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
html[dir=ltr] .stat .n{direction:ltr}
html[dir=ltr] .val,html[dir=ltr] .edge em{direction:ltr}

.banner{display:none;align-items:center;gap:10px;margin-bottom:12px;padding:10px 14px;border-radius:14px;background:linear-gradient(90deg,rgba(255,122,26,.16),rgba(255,176,32,.06));border:1px solid rgba(255,122,26,.4);font-size:12.5px;font-weight:600}
.banner.show{display:flex}
.banner svg{width:18px;height:18px;stroke:var(--acc);flex:none}
.banner .sp{flex:1}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:700 12px 'Segoe UI',sans-serif;padding:7px 14px;border-radius:10px;transition:.15s;white-space:nowrap}
.btn svg{width:14px;height:14px}
.btn.pri{background:linear-gradient(180deg,#ff8a2a,#ff6a00);color:#1a0b00;box-shadow:0 0 18px rgba(255,122,26,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sec{background:#1a1c22;border:1px solid var(--line2);color:var(--txt)}
.btn.sec:hover{border-color:rgba(255,122,26,.45)}
.btn.sec svg{stroke:var(--acc)}
.btn.ghost{color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:#ff6b6b}
.btn.ghost svg{stroke:currentColor}
.btn[disabled]{opacity:.5;pointer-events:none}
.hero .side{display:flex;flex-direction:column;align-items:center;gap:8px}
.seg{display:flex;padding:3px;border-radius:10px;background:#0d0e12;border:1px solid var(--line2)}
.seg button{all:unset;cursor:pointer;font:600 11.5px 'Segoe UI',sans-serif;color:var(--muted);padding:5px 11px;border-radius:7px;transition:.2s;white-space:nowrap}
.seg button.act{background:#24262d;color:var(--txt);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.seg.sm button{padding:4px 9px;font-size:11px}
.full{grid-column:1/-1}
.swap{display:flex;align-items:center;gap:12px;padding:10px 12px}
.swap .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.swap .ic svg{width:17px;height:17px;stroke:var(--muted)}
.swap .tx{flex:1;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.swap .tx b{font-size:13px}
.caps{display:flex;gap:10px;align-items:center}
.capg{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.capg small{font-size:10px;color:var(--dim)}
.capg.wait .cap{color:var(--acc);border-color:var(--acc);box-shadow:0 3px 0 #3a1800,0 0 0 4px rgba(255,122,26,.15),0 0 22px var(--accGlow);font-size:11px}
.prof{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.prof label{font-size:12px;color:var(--muted);font-weight:600}
.sel{position:relative;flex:1}
.sel select{all:unset;box-sizing:border-box;width:100%;cursor:pointer;font:600 12.5px 'Segoe UI',sans-serif;color:var(--txt);background:#0d0e12;border:1px solid var(--line2);border-radius:9px;padding:6px 12px}
.sel select option{background:#16181d;color:var(--txt)}
.sel:after{content:"";position:absolute;top:50%;inset-inline-end:12px;width:6px;height:6px;border:solid var(--muted);border-width:0 2px 2px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.newp{display:none;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.newp.show{display:flex}
.txt{all:unset;box-sizing:border-box;flex:1;font:600 12.5px 'Segoe UI',sans-serif;color:var(--txt);background:#0d0e12;border:1px solid var(--line2);border-radius:9px;padding:6px 12px;user-select:text;-webkit-user-select:text}
.txt:focus{border-color:var(--acc)}
.sub{padding:0 16px 12px 16px;display:flex;gap:8px;align-items:center}
.opt+.sub{margin-top:-4px}
.rows .opt{border-top:1px solid var(--line)}
.rows .opt:first-child{border-top:0}
.pos{display:grid;grid-template-columns:repeat(2,14px);gap:3px;direction:ltr;padding:3px;border-radius:6px;background:#0d0e12;border:1px solid var(--line2)}
.pos i{width:14px;height:10px;border-radius:3px;background:#2a2c33;cursor:pointer;transition:.2s}
.pos i.act{background:var(--acc);box-shadow:0 0 8px var(--accGlow)}
.hidden{display:none!important}
.mini.ar{font-family:'Segoe UI';font-size:10.5px}
html[dir=ltr] .on .edge:before{animation-direction:reverse}

/* random timing: low and high per row */
.rnd{padding:10px 16px;border-bottom:1px solid var(--line)}
.srow{grid-template-columns:118px 1fr auto}
.vals{display:flex;align-items:center;gap:5px;direction:ltr}
.vals .val{width:70px}
.vals .dash{color:var(--dim);font-weight:700;font-size:12px}
.rand .vals .val{width:auto;padding:0 7px}
.rand .vals .val input{width:32px}
.rand .vals .val:first-child u{display:none}
body:not(.rand) .r-only{display:none!important}
.rng{position:relative;height:16px;direction:ltr}
.rng input[type=range]{position:absolute;left:0;top:0}
.rand .rng input[type=range]{pointer-events:none}
.rand .rng input[type=range]::-webkit-slider-thumb{pointer-events:auto}
.rand .rng input[type=range]::-webkit-slider-runnable-track{background:transparent}
.rand .rng:before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;transform:translateY(-50%);border-radius:99px;
  background:linear-gradient(90deg,#22242b calc(8px + (100% - 16px)*var(--lo,0)),#ff6a00 calc(8px + (100% - 16px)*var(--lo,0)),#ffb020 calc(8px + (100% - 16px)*var(--hi,0)),#22242b calc(8px + (100% - 16px)*var(--hi,0)))}
.rand .stat .n{font-size:18px}
.rand .edge em u{display:none}
</style>
</head>
<body>
<div class="app">
<div class="banner" id="banner"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 21h16"/></svg><span id="bannerText"></span><span class="sp"></span><button class="btn pri" id="updBtn"></button></div>

<div class="hd">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#ff7a1a" stroke-width="2" stroke-linecap="round"><g class="ring"><circle cx="12" cy="12" r="8" stroke-dasharray="10 2.6"/></g><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5"/><circle cx="12" cy="12" r="1.6" fill="#ff7a1a"/></svg></div>
  <div class="t"><h1 data-t="title"></h1><p data-t="sub"></p></div>
  <div class="lang" id="lang"><button data-l="ar">ع</button><button data-l="en">EN</button></div>
  <div class="pill"><i></i><span id="pill"></span></div>
</div>

<div class="card hero"><div class="border"></div>
  <div class="pw" id="power"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></div>
  <div class="tx"><b id="hero"></b><span><span data-t="press"></span> <span class="mini" id="toggleKey"></span> <span data-t="ingame"></span></span><div style="font-size:11px;color:var(--dim);margin-top:3px" id="profNow"></div></div>
  <div class="side"><div class="stat"><div class="n" id="total">0</div><div class="l" data-t="total"></div></div>
  <button class="btn sec" id="testBtn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l12 8-12 8z"/></svg><span data-t="test"></span></button></div>
</div>

<div class="h"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span data-t="seq"></span><span class="sp"></span><small data-t="order"></small></div>
<div class="card seq"><div class="flow">
  <div class="node"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></div><span data-t="n1"></span></div>
  <div class="edge"><em><b id="e1">0</b><u>ms</u></em></div>
  <div class="node"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6-3 3-6-6z"/><path d="M11 7L4 20"/></svg></div><span data-t="n2"></span></div>
  <div class="edge"><em><b id="e2">0</b><u>ms</u></em></div>
  <div class="node"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg></div><span id="n3"></span></div>
  <div class="edge"><em><b id="e3">0</b><u>ms</u></em></div>
  <div class="node"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-5-5 5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></div><span id="n4"></span></div>
</div></div>

<div class="h"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg><span data-t="keys"></span><span class="sp"></span><small data-t="keysHint"></small></div>
<div class="grid">

  <div class="newp" id="newp"><input class="txt" id="profName" maxlength="30"><button class="btn pri" id="profSave" data-t="save"></button><button class="btn ghost" id="profCancel" data-t="cancel"></button></div>
  <div class="newp" id="delp"><span style="flex:1;font-size:12.5px" id="delText"></span><button class="btn pri" id="delYes" data-t="del"></button><button class="btn ghost" id="delNo" data-t="cancel"></button></div>

  <div class="opt"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><circle cx="7.5" cy="8.5" r="1.2"/></svg></div><div class="tx"><b data-t="indicator"></b><span data-t="indicatorHint"></span></div><div class="pos" id="pos"><i data-p="1"></i><i data-p="2"></i><i data-p="3"></i><i data-p="4"></i></div><div class="sw" data-flag="Indicator"></div></div>
  <div class="opt"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></div><div class="tx"><b data-t="updates"></b><span data-t="updatesHint"></span></div><div class="sw" data-flag="CheckUpdates"></div></div>

</div>

<script>
const I18N={
 ar:{title:"كاتم السنايبر",sub:"يكتم صوت الطلقة تلقائيًا بعد كل ضربة",press:"اضغط الزر أو",ingame:"وانت داخل اللعبة",total:"مث · مدة الكاتم",test:"جرّب",
  seq:"وش يصير بعد كل طلقة",order:"بالترتيب",n1:"طلقة",n2:"توماهوك",n3:"تبديل",n4:"رجوع",n3b:"مسدس",n4b:"رئيسي",
  keys:"الأزرار",keysHint:"اضغط على أي زر عشان تغيّره · Esc يلغي",kTrigger:"الطلقة",kTomahawk:"التوماهوك",kSwap:"تبديل السلاح",one:"زر واحد",two:"زرين",kSwapOne:"يضغطه مرتين",kPistol:"المسدس",kPrimary:"الرئيسي",kToggle:"تشغيل وإيقاف",kProfile:"تغيير الملف",
  timing:"التوقيت",timingHint:"اسحب أو اكتب الرقم",timingHintR:"حدد أقل وأعلى رقم",random:"توقيت عشوائي",randomHint:"كل طلقة ياخذ رقم عشوائي بين الأقل والأعلى",profile:"الملف",newProf:"جديد",save:"حفظ",cancel:"إلغاء",del:"حذف",profPh:"اسم الملف، مثلاً اسم السنايبر",delAsk:"تحذف الملف «{0}»؟",profNow:"الملف الحالي: {0}",
  game:"اللعبة",gameOnly:"يشتغل بس داخل اللعبة",gameOnlyHint:"برا اللعبة ما يلمس أي زر",detect:"تحديد تلقائي",
  options:"خيارات",track:"تعرّف تلقائي على السلاح",trackHint:"يشتغل بس وانت ماسك السلاح الرئيسي",indicator:"مؤشر على الشاشة",indicatorHint:"يوضح إذا الكاتم شغّال واسم الملف",updates:"تنبيه التحديثات",updatesHint:"يقولك إذا نزل إصدار جديد",
  foot:"لو سكّرت النافذة يكمل شغله من الأيقونة اللي جنب الساعة",
  on:"شغّال",off:"موقّف",heroOn:"الكاتم شغّال",heroOff:"الكاتم موقّف",wait:"اضغط زر",ms:"مث",
  updText:"فيه إصدار جديد {0}",updBtn:"تحديث الحين",updBusy:"جاري التحميل...",
  DelayShot:"انتظار بعد الطلقة",HoldTomahawk:"مدة مسك التوماهوك",DelaySwap:"انتظار قبل التبديل",SwapGap:"بين التبديل والرجوع"},
 en:{title:"Sniper Cancel",sub:"Cancels the shot automatically after every hit",press:"Click the button or press",ingame:"in game",total:"ms · cancel time",test:"Test",
  seq:"What happens after each shot",order:"in order",n1:"Shot",n2:"Tomahawk",n3:"Swap",n4:"Back",n3b:"Pistol",n4b:"Primary",
  keys:"Keys",keysHint:"Click a key to change it · Esc cancels",kTrigger:"Shoot",kTomahawk:"Tomahawk",kSwap:"Weapon swap",one:"One key",two:"Two keys",kSwapOne:"pressed twice",kPistol:"Pistol",kPrimary:"Primary",kToggle:"On / Off",kProfile:"Next profile",
  timing:"Timing",timingHint:"Drag or type a number",timingHintR:"Set the low and the high",random:"Random timing",randomHint:"Every shot picks a random value between low and high",profile:"Profile",newProf:"New",save:"Save",cancel:"Cancel",del:"Delete",profPh:"Profile name, e.g. the sniper",delAsk:"Delete profile “{0}”?",profNow:"Profile: {0}",
  game:"Game",gameOnly:"Only inside the game",gameOnlyHint:"Outside the game it never touches your keys",detect:"Detect",
  options:"Options",track:"Auto weapon detection",trackHint:"Only fires while holding the primary weapon",indicator:"On-screen indicator",indicatorHint:"Shows if it's on and the profile name",updates:"Update alerts",updatesHint:"Tells you when a new version is out",
  foot:"Closing the window keeps it running from the tray icon",
  on:"Active",off:"Off",heroOn:"Cancel is ON",heroOff:"Cancel is OFF",wait:"Press a key",ms:"ms",
  updText:"New version {0} is available",updBtn:"Update now",updBusy:"Downloading...",
  DelayShot:"Wait after shot",HoldTomahawk:"Hold tomahawk",DelaySwap:"Wait before swap",SwapGap:"Swap and back gap"}
};
const TIMING=["DelayShot","HoldTomahawk","DelaySwap","SwapGap"];
const SLIDER_MAX=300;
let LANG="ar";
let S={cfg:{},labels:{},profiles:[],limits:{},enabled:false,capturing:"",version:"",update:{}};
const $=id=>document.getElementById(id);
const send=m=>{try{window.chrome.webview.postMessage(m)}catch(e){}};
const tr=(k,a)=>{let s=(I18N[LANG]||I18N.ar)[k]??I18N.ar[k]??"";return a!==undefined?s.replace("{0}",a):s};
const n=k=>parseInt(S.cfg[k])||0;

const box=$("sliders");
for(const k of TIMING){
  const r=document.createElement("div");r.className="srow";
  r.innerHTML=`<label data-k="${k}"></label><div class="rng"><input type="range" step="5" data-k="${k}"><input type="range" step="5" data-k="${k}Max" class="r-only"></div>`
    +`<div class="vals"><div class="val"><input inputmode="numeric" maxlength="4" data-k="${k}"><u>ms</u></div><span class="dash r-only">–</span><div class="val r-only"><input inputmode="numeric" maxlength="4" data-k="${k}Max"><u>ms</u></div></div>`;
  box.appendChild(r);
}
function lim(k){return S.limits[k]||[0,1000]}
const rnd=()=>n("Random")===1;
const baseOf=k=>k.replace(/Max$/,"");
function put(k,v){ S.cfg[k]=v; send("set|"+k+"|"+v); }
// يغيّر توقيت ويخلي الأقل دايم أصغر من أو يساوي الأعلى: اللي تغيّره يمشي، والثاني يلحقه
// والعشوائي طافي: الأعلى يمشي مع الرقم عشان يبقى نفس النطاق لما تشغّله
function setTiming(k,v){
  const b=baseOf(k), m=b+"Max";
  if(!rnd()&&k===b) put(m,Math.min(lim(m)[1],v+Math.max(0,n(m)-n(b))));
  put(k,v);
  if(n(b)>n(m)){ if(k===m) put(b,n(m)); else put(m,n(b)); }
}
box.addEventListener("input",e=>{
  const k=e.target.dataset.k;if(!k)return;
  if(e.target.type==="range"){ setTiming(k,+e.target.value); render(); }
  else { const v=e.target.value.replace(/\D/g,""); e.target.value=v; const [lo,hi]=lim(k);
    // وانت تكتب الأعلى (مثلاً ١٢٠) ما نرسل "١" و"١٢" عشان ما يسحبون الأقل معهم
    const early=k!==baseOf(k)&&+v<n(baseOf(k));
    if(v!==""&&+v>=lo&&+v<=hi&&!early){ setTiming(k,+v); render(); } }
});
box.addEventListener("focusout",e=>{ const k=e.target.dataset.k; if(!k||e.target.type==="range")return;
  const [lo,hi]=lim(k); let v=parseInt(e.target.value); if(isNaN(v))v=n(k); v=Math.max(lo,Math.min(hi,v));
  setTiming(k,v); render(true); });

function applyLang(){
  const h=document.documentElement; h.lang=LANG; h.dir=LANG==="en"?"ltr":"rtl";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=tr(el.dataset.t));
  document.querySelectorAll(".srow label").forEach(el=>el.textContent=tr(el.dataset.k));
  document.querySelectorAll(".val u,.edge em u").forEach(el=>el.textContent=tr("ms"));
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("act",b.dataset.l===LANG));
  $("profName").placeholder=tr("profPh");
  document.title=tr("title");
}
document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>{ if(LANG===b.dataset.l)return; LANG=b.dataset.l; S.cfg.Lang=LANG; send("set|Lang|"+LANG); applyLang(); render(); });
$("power").onclick=()=>send("toggle");
$("testBtn").onclick=()=>send("test");
$("updBtn").onclick=()=>send("update");
$("detect").onclick=()=>send("detect");
document.querySelectorAll("[data-flag]").forEach(el=>el.onclick=()=>{ const k=el.dataset.flag; S.cfg[k]=n(k)?0:1; send("set|"+k+"|"+S.cfg[k]); render(); });
document.querySelectorAll("#swapMode button").forEach(b=>b.onclick=()=>{ S.cfg.SwapMode=+b.dataset.v; send("set|SwapMode|"+b.dataset.v); render(); });
document.querySelectorAll("#pos i").forEach(el=>el.onclick=()=>{ S.cfg.IndicatorPos=+el.dataset.p; send("set|IndicatorPos|"+el.dataset.p); render(); });
document.querySelectorAll("[data-key]").forEach(el=>el.onclick=()=>{ if(!S.capturing) send("capture|"+el.dataset.key); });
$("gameExe").addEventListener("change",e=>send("set|GameExe|"+e.target.value.trim()));
$("profSel").onchange=e=>send("profile|load|"+e.target.value);
$("profAdd").onclick=()=>{ $("delp").classList.remove("show"); $("newp").classList.add("show"); $("profName").value=""; $("profName").focus(); };
$("profCancel").onclick=()=>$("newp").classList.remove("show");
const saveProf=()=>{ const v=$("profName").value.trim(); if(!v)return; send("profile|new|"+v); $("newp").classList.remove("show"); };
$("profSave").onclick=saveProf;
$("profName").addEventListener("keydown",e=>{ if(e.key==="Enter")saveProf(); if(e.key==="Escape")$("newp").classList.remove("show"); });
$("profDel").onclick=()=>{ if(S.profiles.length<2)return; $("newp").classList.remove("show"); $("delText").textContent=tr("delAsk",S.cfg.Profile); $("delp").classList.add("show"); };
$("delNo").onclick=()=>$("delp").classList.remove("show");
$("delYes").onclick=()=>{ send("profile|del|"); $("delp").classList.remove("show"); };

function render(force){
  const c=S.cfg, two=n("SwapMode")===1;
  document.body.classList.toggle("on",!!S.enabled);
  const R=rnd(); document.body.classList.toggle("rand",R);
  // المجموع: رقم واحد، أو "من–إلى" لو العشوائي شغّال
  const sum=(...ks)=>{ const a=ks.reduce((s,k)=>s+n(k),0), b=ks.reduce((s,k)=>s+n(k+"Max"),0); return R&&b!==a?a+"–"+b:""+a; };
  $("tHint").textContent=tr(R?"timingHintR":"timingHint");
  $("pill").textContent=tr(S.enabled?"on":"off");
  $("hero").textContent=tr(S.enabled?"heroOn":"heroOff");
  const tk=S.labels.Toggle||""; $("toggleKey").textContent=tk; $("toggleKey").classList.toggle("ar",/[؀-ۿ]/.test(tk));
  $("profNow").textContent=c.Profile?tr("profNow",c.Profile):"";
  $("total").textContent=sum(...TIMING);
  $("e1").textContent=sum("DelayShot"); $("e2").textContent=sum("HoldTomahawk","DelaySwap"); $("e3").textContent=sum("SwapGap");
  $("n3").textContent=tr(two?"n3b":"n3"); $("n4").textContent=tr(two?"n4b":"n4");
  document.querySelectorAll("#swapMode button").forEach(b=>b.classList.toggle("act",+b.dataset.v===(two?1:0)));
  $("caps1").classList.toggle("hidden",two); $("caps2").classList.toggle("hidden",!two);
  document.querySelectorAll("[data-key]").forEach(el=>{
    const k=el.dataset.key, cap=el.querySelector(".cap"), w=S.capturing===k;
    el.classList.toggle("wait",w); cap.classList.toggle("wait",w);
    const t=w?tr("wait"):(S.labels[k]||"");
    cap.textContent=t; cap.classList.toggle("ar",/[؀-ۿ]/.test(t)&&!w);
  });
  for(const k of TIMING){
    const m=k+"Max", a=n(k), b=n(m), [lo]=lim(k);
    const top=Math.max(SLIDER_MAX,a,R?b:0), f=v=>Math.min(1,(v-lo)/(top-lo));
    const ra=box.querySelector(`input[type=range][data-k="${k}"]`), rb=box.querySelector(`input[type=range][data-k="${m}"]`);
    for(const [r,v] of [[ra,a],[rb,b]]){ r.min=lo; r.max=top; r.value=v; }
    ra.style.setProperty("--p",f(a)*100+"%");
    ra.parentNode.style.setProperty("--lo",f(a)); ra.parentNode.style.setProperty("--hi",f(b));
    // لو المقبضين فوق بعض: اللي يقدر يتحرك يكون فوق
    ra.style.zIndex=a>=b&&a>(lo+top)/2?3:1; rb.style.zIndex=2;
  }
  box.querySelectorAll("input:not([type=range])").forEach(i=>{ if(force||document.activeElement!==i) i.value=n(i.dataset.k); });
  document.querySelectorAll("[data-flag]").forEach(el=>el.classList.toggle("lit",n(el.dataset.flag)===1));
  document.querySelectorAll("#pos i").forEach(el=>el.classList.toggle("act",+el.dataset.p===n("IndicatorPos")));
  $("pos").style.opacity=n("Indicator")?1:.35;
  $("gameRow").style.opacity=n("GameOnly")?1:.45;
  if(document.activeElement!==$("gameExe")) $("gameExe").value=c.GameExe||"";
  const sel=$("profSel"), list=S.profiles||[];
  if(sel.options.length!==list.length||[...sel.options].some((o,i)=>o.value!==list[i])){ sel.innerHTML=""; for(const p of list){const o=document.createElement("option");o.value=o.textContent=p;sel.appendChild(o);} }
  sel.value=c.Profile||""; $("profDel").disabled=list.length<2;
  const u=S.update||{}; $("banner").classList.toggle("show",!!u.available);
  $("bannerText").textContent=tr("updText",u.latest?("v"+u.latest):"");
  $("updBtn").textContent=tr(u.busy?"updBusy":"updBtn"); $("updBtn").disabled=!!u.busy;
  $("ver").textContent=S.version?("v"+S.version):"";
}
window.chrome?.webview?.addEventListener("message",e=>{
  const d=typeof e.data==="string"?JSON.parse(e.data):e.data; Object.assign(S,d);
  if(S.cfg.Lang&&S.cfg.Lang!==LANG){LANG=S.cfg.Lang;applyLang();}
  render();
});
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",e=>{ if(S.capturing||(e.ctrlKey&&"rpfu".includes(e.key.toLowerCase()))||e.key==="F5") e.preventDefault(); });
applyLang(); render(); send("ready");
</script>
